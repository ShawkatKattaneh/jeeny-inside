<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E4097E" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Jeeny INSIDE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E4097E'/%3E%3Cpath d='M9 22c0-6 14-6 14-12' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='22' r='2.6' fill='white'/%3E%3Ccircle cx='23' cy='10' r='2.6' fill='white'/%3E%3C/svg%3E" />
    <script>
      /* Apply the saved appearance (Light / Dark / System) before first paint, so there is no flash of
         the wrong theme. Kept in sync with client/src/ui/theme.ts. */
      (function () {
        var pref = "system";
        try { var v = localStorage.getItem("jeeny-inside:theme"); if (v === "light" || v === "dark" || v === "system") pref = v; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
